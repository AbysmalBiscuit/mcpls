#:schema https://github.com/AbysmalBiscuit/devkit/releases/latest/download/devkit-config.json

[defaults]
worktree_root = "../mcpls_worktrees/"
baseline_ref = "origin/main"
pr_create_state = "ready"

[tracker]
kind = "github"

[harness]
enforce_writes = true
enforce_commands = true

[harness.commands.worktree-add]
programs = ["git"]
args = ["worktree", "add"]
reason = "Use devkit's issue binary to create worktrees: issue setup --summary --slug [branch-name]"

[harness.commands.worktree-remove]
programs = ["git"]
args = ["worktree", "remove"]
reason = "Use devkit's issue binary to remove worktrees: issue end [branch-name]"

[harness.commands.sudo]
programs = ["sudo"]
reason = "Never run sudo"

[harness.commands.pr-create]
programs = ["gh"]
args = ["pr", "create"]
reason = """Use devkit to open PRs: `issue pr create`. It pushes the branch, renders the title and body from the config templates, opens it ready for review, and records the PR on the worktree.
Supply:
  --pr-title "type(scope): subject"   conventional-commit title, no trailing period
  --pr-body "<markdown>"              the body; the template appends the closing line, so leave the issue reference out
  --arg issue_magic_word=Closes       closing keyword: Closes, Fixes, or Resolves
  --arg also_closes="12 13"           further issue numbers to close, space- or comma-separated
  --arg agent_model="Opus 5"          model that wrote the change; omit on a human-written PR
  --arg agent_harness="Claude Code"   coding agent harness; with the model it renders the trailer
  --base <branch>                     only when the base is not `defaults.pr_base`
The issue number comes from the worktree's .devkit/issue.toml, so a worktree made by `issue setup --slug` (no issue id) gets no closing line."""

[tasks.build]
description = "Build the workspace"
run = ["cargo", "build", "--workspace", "--locked"]
guard = true

[tasks.build-release]
description = "Build the workspace with release optimizations"
run = ["cargo", "build", "--workspace", "--release", "--locked"]
guard = true

[tasks.check]
description = "Check all workspace targets and features"
run = [
    "cargo",
    "check",
    "--workspace",
    "--all-targets",
    "--all-features",
    "--locked",
]
guard = true

[tasks.test]
description = "Run workspace tests with nextest"
run = ["cargo", "nextest", "run", "--workspace", "--all-features", "--locked"]
guard = true

[tasks.test-doc]
description = "Run workspace documentation tests"
run = ["cargo", "test", "--doc", "--workspace", "--all-features", "--locked"]
guard = true

[tasks.build-bin]
description = "Build the mcpls binary the end-to-end suite drives"
run = ["cargo", "build", "--bin", "mcpls", "--locked"]
guard = true

[tasks.test-e2e-run]
description = "Run the ignored end-to-end tests against the built binary"
run = [
    "cargo",
    "nextest",
    "run",
    "--workspace",
    "--all-features",
    "--locked",
    "--run-ignored",
    "ignored-only",
    "-E",
    "kind(test) and test(e2e)",
]
guard = true

[tasks.test-e2e]
description = "Build mcpls and run the ignored end-to-end tests"
steps = [{ task = "build-bin" }, { task = "test-e2e-run" }]

[tasks.fmt]
description = "Format the workspace with nightly rustfmt"
run = ["cargo", "+nightly", "fmt", "--all"]
guard = true

[tasks.fmt-check]
description = "Check workspace formatting with nightly rustfmt"
run = ["cargo", "+nightly", "fmt", "--all", "--", "--check"]
guard = true

[tasks.lint]
description = "Run clippy with warnings denied"
run = [
    "cargo",
    "clippy",
    "--workspace",
    "--all-targets",
    "--all-features",
    "--locked",
    "--",
    "-D",
    "warnings",
]
guard = true
env = { ZCCACHE_PATH_REMAP = "off" }

[tasks.docs]
description = "Build workspace API documentation"
run = ["cargo", "doc", "--workspace", "--no-deps", "--all-features", "--locked"]
guard = true

[tasks.clean]
description = "Remove Cargo build artifacts"
run = ["cargo", "clean"]
guard = true

[tasks.verify]
description = "Check formatting, lint, and run tests including documentation tests"
steps = [
    { task = "fmt-check" },
    { task = "lint" },
    { task = "test" },
    { task = "test-doc" },
]


# refused by the rule above so the trailers cannot be forgotten.
[tasks.commit]
description = "Commit staged changes with a Conventional Commits message and agent co-author trailers"
guard = false
run = ["git", "commit", "-m", '''
{{- commit_subject | trim }}
{%- if commit_body | trim %}

{{ commit_body | trim }}
{%- endif %}
{%- if coauthors | trim(" ;") %}
{% for c in coauthors | split(";") | map("trim") | reject("eq", "") %}
Co-authored-by: {{ c }}
{%- endfor %}
{%- endif %}
''']

# Same message, rewriting the last commit instead of adding one. Separate task
# because a task's argv is fixed: an empty `--amend` slot would reach git as an
# empty argument rather than disappearing.
[tasks.commit-amend]
description = "Rewrite the last commit with a fresh message and agent co-author trailers"
guard = false
run = ["git", "commit", "--amend", "-m", '''
{{- commit_subject | trim }}
{%- if commit_body | trim %}

{{ commit_body | trim }}
{%- endif %}
{%- if coauthors | trim(" ;") %}
{% for c in coauthors | split(";") | map("trim") | reject("eq", "") %}
Co-authored-by: {{ c }}
{%- endfor %}
{%- endif %}
''']

[templates]
pr_body = '''
{%- set own = (issue_magic_word ~ " " ~ ("#" if issue and issue[0] in "0123456789" else "") ~ issue) if issue else "" -%}
{%- set ref_lines = ((own ~ ";" ~ refs) if own else refs) | split(";") | map("trim") | reject("eq", "") | list -%}
{%- set agent = agent_model or agent_harness -%}
## TL;DR (human written)
{{ human_tldr }}
{%- if ref_lines %}

---

{{ ref_lines | join("\n") }}
{%- endif %}
{%- if agent %}

---

## Agent summary (the rest is not human-written)
{%- endif %}

{{ input | trim }}
{%- if agent %}

---
{%- if implemented_by | trim %}

Implemented by {{ implemented_by | trim }}
{%- endif %}

🤖 Generated with {{ agent_model }}{% if agent_model and agent_harness %} via {% endif %}{{ agent_harness }}
{%- endif %}
'''

# Declared so the template above renders (an undefined name is a hard error)
# and so `issue pr create --arg` accepts them: --arg is checked against this
# table, not against the template.
[templates.variables]

# Subject line, body and `Co-Authored-By:` trailers of a `devrun task commit`
# message. `coauthors` is `;`-separated, each entry a full `Name <email>`.
commit_subject = ""
commit_body = ""
coauthors = ""

# Filled by a human after the PR is open; agents leave it empty.
human_tldr = ""

# The worktree's own issue, supplied by the render context in a worktree that
# `issue setup` created. Declared here so the template also renders outside one.
issue = ""

# Magic word for the worktree's own issue. `Closes` on a branch that finishes
# it, `Refs` on one that does not.
issue_magic_word = "Closes"

# Every other issue line, verbatim and `;`-separated, so one PR can mix
# trackers and magic words:
#   --arg refs='Closes ENG-1234; Closes #90; Refs #3'
refs = ""

# Attribution for the agent summary. `agent_harness` carries the markdown link
# a harness wants in its credit line; `implemented_by` is the free-prose
# sentence naming who did which part of the work.
agent_model = ""
agent_harness = ""
implemented_by = ""
