# Example MCPLS configuration file
# Copy to ~/.config/mcpls/mcpls.toml or specify with --config flag.
# If placed as ./mcpls.toml in a project directory instead, mcpls ignores it
# unless you pass --trust-project-config (or set MCPLS_TRUST_PROJECT_CONFIG=true) —
# see docs/user-guide/configuration.md#trusting-a-project-local-config.

# Workspace settings
[workspace]
# Root directories for the workspace
roots = [
    # Add your project paths here
    # "/home/user/projects/myproject",
]

# Position encoding preference (utf-8 is more efficient for Rust)
position_encodings = ["utf-8", "utf-16"]

# Language extension mappings (optional)
# mcpls recognizes 30 languages by default. Customize here to:
# - Add support for specialized file types
# - Override default associations
# - Include only languages you need

# Example: Add Nushell support
# [[language_extensions]]
# extensions = ["nu"]
# language_id = "nushell"

# Example: Override Rust detection to use custom language ID
# [[language_extensions]]
# extensions = ["rs"]
# language_id = "custom-rust"

# Default language extensions (automatically included if not specified):
# - Rust: rs
# - Python: py, pyw, pyi
# - JavaScript: js, mjs, cjs
# - TypeScript: ts, mts, cts, tsx
# - Go: go
# - C: c, h
# - C++: cpp, cc, cxx, hpp, hh, hxx
# - Java: java
# - Ruby: rb
# - PHP: php
# - Swift: swift
# - Kotlin: kt, kts
# - Scala: scala, sc
# - Zig: zig
# - Lua: lua
# - Shell: sh, bash, zsh
# - JSON: json
# - TOML: toml
# - YAML: yaml, yml
# - XML: xml
# - HTML: html, htm
# - CSS: css
# - SCSS: scss
# - Less: less
# - Markdown: md, markdown
# - C#: cs
# - F#: fs, fsi, fsx
# - R: r, R
# - JSX: jsx
# - TSX: tsx (TypeScript React)

# mcpls ships six built-in servers, one per language below (rust, python,
# typescript, go, cpp, zig) — all six are active by default, with no
# [[lsp_servers]] entry needed. An entry you write MERGES onto the built-in
# sharing its identity (`name` if set, else `language_id`): a field you omit
# is inherited from the built-in, a field you set overrides it. Overriding
# `command` also drops the built-in's `args`, `env` and
# `initialization_options`, since those belong to the binary being replaced.
# See docs/user-guide/configuration.md for the full semantics.

# Rust - override the built-in's handshake timeout; command, args and
# file_patterns are still rust-analyzer's.
[[lsp_servers]]
language_id = "rust"
timeout_seconds = 30

# [lsp_servers.initialization_options]
# cargo.features = "all"
# checkOnSave.command = "clippy"

# Don't want a built-in server to spawn at all? Disable it:

# [[lsp_servers]]
# language_id = "go"
# enabled = false

# Use a different Python server (ty) instead of the built-in pyright.
# Overriding `command` drops pyright's `--stdio` argument; file_patterns
# are inherited from the built-in, since they describe the language rather
# than the binary.
# [[lsp_servers]]
# language_id = "python"
# command = "ty"
# args = ["server"]

# Explicit per-tool routing: run two servers for one language, each owning
# a distinct subset of MCP tools. `name` gives each server a routing
# identity (defaults to language_id, but two servers for one language must
# not share it); `handles` restricts a server to exactly those tools --
# omit `handles` for a catch-all that serves everything not claimed
# elsewhere. The built-in `python` server is disabled first: its own
# catch-all would otherwise collide with `pyright`'s below, since both are
# catch-alls for `python`.
# [[lsp_servers]]
# language_id = "python"
# enabled = false
#
# [[lsp_servers]]
# name = "pyright"
# language_id = "python"
# command = "pyright-langserver"
# args = ["--stdio"]
# file_patterns = ["**/*.py"]
#
# [[lsp_servers]]
# name = "pylsp"
# language_id = "python"
# command = "pylsp"
# file_patterns = ["**/*.py"]
# handles = ["diagnostics"]

# Diagnostics: severity floor and volume caps applied when diagnostics are
# delivered. Uncomment to change the defaults shown here.
# [diagnostics]
# severity = "warning"
# max_per_file = 10
# max_total = 50
# settle_quiet_ms = 1000
# settle_deadline_ms = 60000

# Raise a single server's own floor above the global default -- "off" mutes
# diagnostics for that server without disabling the server itself.
# [[lsp_servers]]
# language_id = "rust"
# diagnostics_severity = "error"
