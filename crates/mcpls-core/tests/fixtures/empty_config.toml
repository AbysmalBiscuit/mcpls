# Protocol-only configuration for E2E testing.
#
# Every built-in server is disabled: these tests exercise the MCP layer, and
# spawning a language server here would make each of them wait on an index.

[workspace]
roots = []

# These tests exercise the MCP layer. Leaving hooks on would have every
# spawned server bind a socket and a lock in the user's shared runtime
# directory, which nothing ever removes.
[diagnostics.hooks]
enabled = false

[[lsp_servers]]
language_id = "rust"
enabled = false

[[lsp_servers]]
language_id = "python"
enabled = false

[[lsp_servers]]
language_id = "typescript"
enabled = false

[[lsp_servers]]
language_id = "go"
enabled = false

[[lsp_servers]]
language_id = "cpp"
enabled = false

[[lsp_servers]]
language_id = "zig"
enabled = false
