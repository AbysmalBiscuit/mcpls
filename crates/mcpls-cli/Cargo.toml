[package]
name = "mcpls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Universal MCP to LSP bridge CLI - expose Language Server Protocol capabilities as MCP tools"
keywords = ["mcp", "lsp", "language-server", "cli", "claude"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "mcpls"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
clap_complete = { workspace = true }
clap_complete_nushell = { workspace = true }
dunce = { workspace = true }
mcpls-core = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }

[target.'cfg(windows)'.dependencies]
base64 = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
strum = { workspace = true }
tempfile = { workspace = true }

[features]
default = []
transport-http = ["mcpls-core/transport-http"]

[lints]
workspace = true
