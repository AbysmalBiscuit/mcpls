[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.3.11"
edition = "2024"
rust-version = "1.88"
authors = ["Andrei G. <k05h31@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/AbysmalBiscuit/mcpls"
homepage = "https://github.com/bug-ops/mcpls"
description = "Universal MCP to LSP bridge - expose Language Server Protocol capabilities as MCP tools"
keywords = ["mcp", "lsp", "language-server", "ai", "claude"]
categories = ["development-tools", "command-line-utilities"]

[workspace.dependencies]
# Sorted alphabetically
anyhow = "1.0"
assert_cmd = "2.2"
axum = "0.8"
chrono = "0.4.45"
clap = "4.6"
clap_complete = "4.6"
clap_complete_nushell = "4.6"
dirs = "6.0"
dunce = "1.0.5"
fs4 = { version = "0.12", features = ["sync"] }
futures = "0.3"
globset = "0.4"
ignore = "0.4"
lsp-types = "0.97"
mcpls-core = { path = "crates/mcpls-core", version = "0.3.11" }
notify = "8.2.0"
predicates = "3.1"
rmcp = "3.1.0"
rstest = "0.26"
rustix = { version = "1.1.4", features = ["fs"] }
schemars = "1.2"
serde = "1.0"
serde_json = "1.0"
strum = { version = "0.27", features = ["derive"] }
tempfile = "3.27"
thiserror = "2.0"
tokio = "1.53"
tokio-util = "0.7"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2.5"
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_System_Console",
] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
