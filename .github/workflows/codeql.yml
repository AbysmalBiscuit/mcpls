name: CodeQL

on:
  push:
    branches: [main]
  pull_request_target:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

# Minimal permissions: no secrets exposed, no write access beyond security-events.
# pull_request_target with checkout of fork head SHA is safe here because:
# - no secrets are passed to the job
# - autobuild compiles but does not execute code with elevated privileges
# - this is the only supported pattern for scanning fork PRs with CodeQL
permissions: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # For pull_request_target: check out the fork head to scan PR changes.
          # For push/schedule: github.sha resolves to the pushed commit.
          # Safe because this job has no access to secrets.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # actions/checkout v7 refuses fork checkouts in pull_request_target
          # workflows by default ("pwn request" guard). Opting in is safe here
          # per the threat model documented above: no secrets, permissions
          # scoped to security-events:write + contents:read only.
          allow-unsafe-pr-checkout: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
