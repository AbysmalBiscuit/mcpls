name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  # Build cross-platform binaries
  build-binaries:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            use_cross: false

          # Linux aarch64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            use_cross: true

          # macOS x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
            use_cross: false

          # macOS aarch64 (M1/M2)
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            use_cross: false

          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            use_cross: false

          # Windows aarch64 (ARM64)
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            archive: zip
            use_cross: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # dtolnay/rust-toolchain stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@75b4bfae1b2c753a6806bbce6e6cb89b602de33c # cargo-bins/cargo-binstall main

      - name: Install Rust target stdlib
        run: rustup target add ${{ matrix.target }}

      - name: Install cross (for cross-compilation)
        if: matrix.use_cross
        run: cargo binstall --no-confirm cross

      - name: Cache Cargo
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # Swatinem/rust-cache v2
        with:
          shared-key: "release-${{ matrix.target }}"

      - name: Build release (cross)
        if: matrix.use_cross
        run: cross build --package mcpls --release --target ${{ matrix.target }}

      - name: Build release (native)
        if: "!matrix.use_cross"
        run: cargo build --package mcpls --release --target ${{ matrix.target }}

      - name: Get binary name
        id: binary
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            echo "name=mcpls.exe" >> $GITHUB_OUTPUT
          else
            echo "name=mcpls" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Strip binary (Linux/macOS, native only)
        if: matrix.os != 'windows-latest' && !matrix.use_cross
        run: strip target/${{ matrix.target }}/release/${{ steps.binary.outputs.name }}

      - name: Create archive (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../mcpls-${{ matrix.target }}.tar.gz ${{ steps.binary.outputs.name }}
          cd ../../..
          shasum -a 256 mcpls-${{ matrix.target }}.tar.gz > mcpls-${{ matrix.target }}.tar.gz.sha256

      - name: Create archive (Windows)
        if: matrix.archive == 'zip'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../mcpls-${{ matrix.target }}.zip ${{ steps.binary.outputs.name }}
          cd ../../..
          certUtil -hashfile mcpls-${{ matrix.target }}.zip SHA256 > mcpls-${{ matrix.target }}.zip.sha256
        shell: cmd

      - name: Upload release archive
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # softprops/action-gh-release v2
        with:
          files: |
            mcpls-${{ matrix.target }}.*

  # Update release notes with installation instructions
  update-release-notes:
    name: Update Release Notes
    needs: [build-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v6

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Update release with installation instructions
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # softprops/action-gh-release v2
        with:
          append_body: true
          body: |

            ## Installation

            ### Binary Installation

            Download the appropriate binary for your platform from the assets below:

            - **Linux x86_64**: `mcpls-x86_64-unknown-linux-gnu.tar.gz`
            - **Linux aarch64**: `mcpls-aarch64-unknown-linux-gnu.tar.gz`
            - **macOS x86_64**: `mcpls-x86_64-apple-darwin.tar.gz`
            - **macOS ARM64**: `mcpls-aarch64-apple-darwin.tar.gz`
            - **Windows x64**: `mcpls-x86_64-pc-windows-msvc.zip`
            - **Windows ARM64**: `mcpls-aarch64-pc-windows-msvc.zip`

            Extract and add to your PATH:

            ```bash
            # Linux/macOS
            tar xzf mcpls-*.tar.gz
            sudo mv mcpls /usr/local/bin/

            # Verify installation
            mcpls --version
            ```

            ### Claude Code and Codex plugin

            The plugin downloads this release on first use. See the [plugin README](https://github.com/AbysmalBiscuit/mcpls/tree/v${{ steps.version.outputs.version }}/plugin#install).

            ## Checksums

            SHA256 checksums are available for all artifacts (`.sha256` files).
